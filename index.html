<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Neon Casino</title><style>
:root{--bg:#07080d;--panel:#10121b;--panel2:#171a25;--gold:#f3c85b;--text:#f5f5f7;--muted:#9da2b3;--red:#d94b62;--green:#45d49a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial}.app{min-height:100vh;background:linear-gradient(145deg,#07080d,#0b0e17 55%,#11101a)}header{padding:22px 6vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #252938;background:#090b11cc;backdrop-filter:blur(8px)}.brand{font-size:24px;font-weight:900;letter-spacing:.08em}.brand span{color:var(--gold)}.balance{padding:10px 16px;border:1px solid #3a3440;border-radius:999px;background:#121520}.balance b{color:var(--gold)}main{max-width:1100px;margin:auto;padding:38px 6vw 70px}.hero{text-align:center;margin-bottom:30px}.hero h1{font-size:clamp(34px,6vw,62px);margin:0 0 10px}.hero p{color:var(--muted);margin:0}.tabs{display:flex;gap:10px;justify-content:center;margin:28px 0;flex-wrap:wrap}.tabs button,.btn{border:1px solid #303444;background:#151824;color:#fff;padding:12px 18px;border-radius:12px;cursor:pointer;font-weight:800}.tabs button.active,.btn.primary{background:linear-gradient(135deg,#f5d56f,#b88625);color:#17130a;border-color:#f3c85b}.game{display:none;background:linear-gradient(180deg,#131620,#0f1119);border:1px solid #292d3b;border-radius:24px;padding:28px;box-shadow:0 18px 60px #0007}.game.active{display:block}.game h2{text-align:center;margin-top:0}.slotbox{display:flex;justify-content:center;gap:12px;margin:28px 0}.reel{width:100px;height:100px;border-radius:18px;background:#f7f7f7;color:#111;display:grid;place-items:center;font-size:52px;box-shadow:inset 0 -8px 0 #ddd}.controls{text-align:center}.bet{display:flex;gap:10px;justify-content:center;align-items:center;margin-bottom:15px}.bet input{width:120px;background:#0b0d14;color:#fff;border:1px solid #343848;padding:11px;border-radius:10px}.msg{text-align:center;min-height:25px;color:var(--gold);font-weight:800}.roulette{display:grid;place-items:center}.wheel{width:190px;height:190px;border-radius:50%;background:conic-gradient(#b82d43 0 10%,#17191f 10% 20%,#b82d43 20% 30%,#17191f 30% 40%,#b82d43 40% 50%,#17191f 50% 60%,#b82d43 60% 70%,#17191f 70% 80%,#b82d43 80% 90%,#17191f 90%);border:9px solid #d2a83d;display:grid;place-items:center;transition:transform 1.4s cubic-bezier(.2,.8,.2,1);font-size:28px;font-weight:900}.choices{display:flex;justify-content:center;gap:10px;margin:20px 0;flex-wrap:wrap}.blackjack .cards{display:flex;justify-content:center;gap:14px;min-height:130px;align-items:center}.card{width:82px;height:116px;background:#f8f8f8;color:#111;border-radius:12px;display:grid;place-items:center;font-size:27px;font-weight:900}.foot{text-align:center;color:#777d8e;font-size:12px;margin-top:28px}.danger{color:#ff8394}
</style></head><body><div class="app"><header><div class="brand">ROYAL <span>NEON</span></div><div class="balance">Crédits virtuels : <b id="balance">1000</b> 🪙</div></header><main><section class="hero"><h1>CASINO NIGHT</h1><p>Joue gratuitement avec des crédits fictifs. Aucun argent réel.</p></section><nav class="tabs"><button class="active" data-tab="slots">🎰 Machines à sous</button><button data-tab="roulette">🎡 Roulette</button><button data-tab="blackjack">🂡 Blackjack</button></nav>
<section id="slots" class="game active"><h2>Lucky 777</h2><div class="slotbox"><div class="reel" id="r1">🍒</div><div class="reel" id="r2">🍋</div><div class="reel" id="r3">🍀</div></div><div class="controls"><div class="bet">Mise <input id="slotBet" type="number" min="1" value="25"></div><button class="btn primary" id="spin">Lancer</button><div class="msg" id="slotMsg"></div></div></section>
<section id="roulette" class="game"><h2>Roulette</h2><div class="roulette"><div class="wheel" id="wheel">0–36</div></div><div class="choices"><button class="btn" data-choice="red">Rouge ×2</button><button class="btn" data-choice="black">Noir ×2</button><button class="btn" data-choice="green">Vert ×14</button></div><div class="controls"><div class="bet">Mise <input id="rouletteBet" type="number" min="1" value="25"></div><button class="btn primary" id="roll">Faire tourner</button><div class="msg" id="rouletteMsg"></div></div></section>
<section id="blackjack" class="game blackjack"><h2>Blackjack</h2><div class="cards"><div class="card" id="playerCard">?</div><div class="card" id="dealerCard">?</div></div><div class="controls"><div class="bet">Mise <input id="bjBet" type="number" min="1" value="25"></div><button class="btn primary" id="deal">Distribuer</button> <button class="btn" id="hit">Tirer</button><div class="msg" id="bjMsg"></div></div></section><div class="foot">Démo ludique • crédits sans valeur • aucun paiement • aucun retrait</div></main></div><script>
let balance=1000;const $=id=>document.getElementById(id);function setBal(){ $('balance').textContent=balance}function bet(id){let n=Math.floor(Number($(id).value));return Number.isFinite(n)&&n>0?n:0}function play(cost){if(cost>balance){alert('Pas assez de crédits virtuels.');return false}balance-=cost;setBal();return true}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.game').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});
const symbols=['🍒','🍋','🍀','🔔','💎','7️⃣'];$('spin').onclick=()=>{let b=bet('slotBet');if(!b||!play(b))return;let a=[0,0,0].map(()=>symbols[Math.floor(Math.random()*symbols.length)]);['r1','r2','r3'].forEach((id,i)=>$(id).textContent=a[i]);let win=a[0]===a[1]&&a[1]===a[2]?b*8:a[0]===a[1]||a[1]===a[2]||a[0]===a[2]?b*2:0;balance+=win;setBal();$('slotMsg').textContent=win?'🎉 Gain de '+win+' crédits !':'Perdu — retente ta chance !'};
let choice='red';document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>x.classList.remove('primary'));b.classList.add('primary')});$('roll').onclick=()=>{let b=bet('rouletteBet');if(!b||!play(b))return;let n=Math.floor(Math.random()*37);let c=n===0?'green':n%2?'red':'black';$('wheel').style.transform='rotate('+(720+n*20)+'deg)';let win=c===choice?b*(choice==='green'?14:2):0;balance+=win;setBal();$('rouletteMsg').textContent='Résultat : '+n+' '+c+(win?' — 🎉 +'+win:' — perdu')};
let bjStarted=false;function card(){return Math.floor(Math.random()*10)+2}$('deal').onclick=()=>{let b=bet('bjBet');if(!b||!play(b))return;bjStarted=true;let p=card(),d=card();$('playerCard').textContent=p;$('dealerCard').textContent=d;let msg=p>d?'Tu es devant !':p===d?'Égalité':'Le casino mène.';if(p===d)balance+=b;else if(p>d)balance+=b*2;setBal();$('bjMsg').textContent=msg+(p>=d?' 🎉':'')};$('hit').onclick=()=>{if(!bjStarted){$('bjMsg').textContent='Distribue une main d’abord.';return}let p=Number($('playerCard').textContent)+card();$('playerCard').textContent=p;if(p>21){$('bjMsg').textContent='💥 Tu dépasses 21 !';bjStarted=false}else $('bjMsg').textContent='Tu as '+p+'. Tire encore ou distribue une nouvelle main.'};
</script></body></html>
